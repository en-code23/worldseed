[package]
name = "seedcore"
version = "0.1.0"
edition = "2021"
description = "Terraria .wld reader, map renderer and world analyzer"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
png = "0.17"
