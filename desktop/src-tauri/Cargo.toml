[package]
name = "worldseed"
version = "0.1.1"
description = "Worldseed: Terraria seed generator and world map viewer"
edition = "2021"
license = "MIT"

[lib]
name = "worldseed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seedcore = { path = "../../core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
